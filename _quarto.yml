# Configurazione del sito.
# Per aggiungere una pagina: crea il file .qmd, poi aggiungilo alla navbar qui sotto.
project:
  type: website
  output-dir: docs          # cartella con il sito generato (per GitHub Pages)
  render:
    - "*.qmd"               # si renderizzano solo le pagine di questa cartella,
                            # non i file dentro materiali/
  resources:
    - "materiali/struttura-2/**"  # i file dell'esempio Psych-DS finiscono nel sito cosi' come sono
    - "materiali.zip"             # esempio Psych-DS (pagina Struttura)

website:
  title: "Hands-on Open Science"
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - href: apertura.qmd
        text: Intro
      - href: fair.qmd
        text: Principi FAIR
      - text: Archiviare
        menu:
          - href: repository.qmd
            text: Dove archiviare
          - href: zenodo.qmd
            text: Depositare su Zenodo
          - href: psycharchives.qmd
            text: Depositare su PsychArchives
          - href: versioni.qmd
            text: Versioni e correzioni
      - href: licenze.qmd
        text: Licenze
      - text: Struttura
        menu:
          - href: struttura-1.qmd
            text: README e Data dictionary
          - href: struttura-2.qmd
            text: Psych-DS
      - href: risorse.qmd
        text: Risorse
  page-footer:
    border: true
    left: "Seminario del 23 settembre 2026 — Margherita Calderan, Dipartimento di Psicologia Generale, Università di Padova"
    right: "Contenuti [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.it) · [Fonti](risorse.qmd#fonti)"

format:
  html:
    theme: [cosmo, custom.scss]
    grid:
      body-width: 940px
      sidebar-width: 210px
      margin-width: 230px
    toc: true
    toc-title: "In questa pagina"
    toc-depth: 2
    lang: it
    smooth-scroll: true
    code-copy: true
    link-external-newwindow: true
