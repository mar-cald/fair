# Configurazione del sito.
# Per aggiungere una pagina: crea il file .qmd, poi aggiungilo alla navbar qui sotto.
project:
  type: website
  output-dir: docs          # cartella con il sito generato (per GitHub Pages)
  render:
    - "*.qmd"               # si renderizzano solo le pagine di questa cartella,
                            # non i file dentro materiali/
  resources:
    - "materiali/struttura-2/**"  # i file dell'esempio Psych-DS finiscono nel sito cosi' come sono
    - "materiali.zip"             # esempio Psych-DS (pagina Struttura)

website:
  title: "Open Science"
  navbar:
    background: "#6d1720"
    foreground: light
    left:
      - href: apertura.qmd
        text: Intro
      - href: fair.qmd
        text: Principi FAIR
      - text: Archiviare
        menu:
          - href: repository.qmd
            text: Dove archiviare
          - href: zenodo.qmd
            text: Depositare su Zenodo
          - href: psycharchives.qmd
            text: Depositare su PsychArchives
          - href: confronto.qmd
            text: Zenodo o PsychArchives?
      - href: licenze.qmd
        text: Licenze
      - text: Struttura
        menu:
          - href: struttura-1.qmd
            text: README e Data dictionary
          - href: struttura-2.qmd
            text: Psych-DS
      - href: esempio.qmd
        text: Esempio
      - href: risorse.qmd
        text: Risorse
    right:
      - icon: bug
        aria-label: "Segnala un errore o una correzione"
        menu:
          - text: "Apri una issue su GitHub"
            href: "https://github.com/mar-cald/fair/issues/new?title=Segnalazione&body=Pagina%3A%20%0ACosa%20ho%20notato%3A%20"
          - text: "Scrivimi una email"
            href: segnala.qmd
  page-footer:
    border: true
    left: "Margherita Calderan<br>Dipartimento di Psicologia Generale, Università di Padova"
    right: "Contenuti [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.it) · [Fonti](risorse.qmd#fonti)"

format:
  html:
    theme: [cosmo, custom.scss]
    grid:
      body-width: 940px
      sidebar-width: 210px
      margin-width: 230px
    toc: true
    toc-title: "In questa pagina"
    toc-depth: 2
    lang: it
    smooth-scroll: true
    code-copy: true
    link-external-newwindow: true
