schema_version: "1.1"
name: code-order-without-r
expected_outcome: |
  A report in Italian on the code only. It says 00_prep.R reads ids_model.csv, written by
  01_model.R which is numbered later (circular dependency), that groups.csv is read but written by no
  script, that kable() is used without knitr or kableExtra loaded, that stan() runs without a seed, and
  that an age is computed from Sys.Date(). If R is not available the code status is "not run", not
  failed for that reason alone.
context:
  scaffold_script: place-files.sh
